<script>
(function() {
  var pages = [
    { label: "📈 Cotización Bolivia",        href: "#cotizacion-bolivia" },
    { label: "📊 Otros Datos",               href: "#otros-datos" },
    { label: "🤖 Modelo Econométrico",        href: "#modelo-econometrico" },
    { label: "📅 Comportamiento por Mes",     href: "#comportamiento-por-mes" },
    { label: "🏦 Dólar Referencial BCB",      href: "#dolar-referencial-y-tipo-de-cambio-flexible-bcb" },
    { label: "💱 Bancos Comerciales",         href: "#bancos-comerciales" },
    { label: "🔬 Modelo Diario (Tentativo)",  href: "#modelo-diario-tentativo" }
  ];

  function buildSidebar() {
    var sidebar = document.createElement("nav");
    sidebar.id = "sb-nav";

    var title = document.createElement("div");
    title.id = "sb-title";
    title.textContent = "SECCIONES";
    sidebar.appendChild(title);

    var ul = document.createElement("ul");
    pages.forEach(function(p) {
      var li = document.createElement("li");
      var a  = document.createElement("a");
      a.href = p.href;
      a.textContent = p.label;
      a.addEventListener("click", function() {
        ul.querySelectorAll("a").forEach(function(x){ x.classList.remove("sb-active"); });
        a.classList.add("sb-active");
      });
      li.appendChild(a);
      ul.appendChild(li);
    });
    sidebar.appendChild(ul);
    document.body.appendChild(sidebar);

    // Marcar activo según hash
    function markActive() {
      var hash = window.location.hash || pages[0].href;
      ul.querySelectorAll("a").forEach(function(a) {
        a.classList.toggle("sb-active", a.getAttribute("href") === hash);
      });
    }
    window.addEventListener("hashchange", markActive);
    markActive();

    // Ocultar links de páginas en la navbar superior (dejar solo el título)
    function hideNavLinks() {
      var navLinks = document.querySelectorAll(".navbar-nav > li > a");
      navLinks.forEach(function(el) { el.parentElement.style.display = "none"; });
    }
    // Intentar varias veces hasta que el DOM esté listo
    var attempts = 0;
    var interval = setInterval(function() {
      hideNavLinks();
      attempts++;
      if (attempts > 10) clearInterval(interval);
    }, 100);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", buildSidebar);
  } else {
    buildSidebar();
  }
})();
</script>

<style>
/* ── Sidebar fijo izquierda ────────────────────────────────────────────── */
#sb-nav {
  position: fixed;
  top: 0;
  left: 0;
  width: 210px;
  height: 100vh;
  background: #0d1117;
  border-right: 2px solid #1ee29d;
  box-shadow: 3px 0 16px rgba(0,0,0,0.5);
  z-index: 1500;
  overflow-y: auto;
  padding: 0;
  display: flex;
  flex-direction: column;
  -webkit-overflow-scrolling: touch;
}

/* ── Título ────────────────────────────────────────────────────────────── */
#sb-title {
  color: #1ee29d;
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  padding: 58px 16px 10px 16px;   /* 58px = debajo de la navbar */
  border-bottom: 1px solid #21262d;
  flex-shrink: 0;
}

/* ── Links ─────────────────────────────────────────────────────────────── */
#sb-nav ul {
  list-style: none;
  margin: 8px 0 0 0;
  padding: 0;
  flex: 1;
}
#sb-nav ul li { margin: 0; padding: 0; }
#sb-nav ul a {
  display: block;
  padding: 10px 16px;
  color: #8b949e;
  text-decoration: none;
  font-size: 0.80rem;
  font-weight: 500;
  border-left: 3px solid transparent;
  transition: color 0.15s, background 0.15s, border-color 0.15s;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#sb-nav ul a:hover {
  color: #e6edf3;
  background: rgba(30,226,157,0.07);
  border-left-color: #537D8D;
}
#sb-nav ul a.sb-active {
  color: #1ee29d;
  background: rgba(30,226,157,0.13);
  border-left-color: #1ee29d;
  font-weight: 700;
}

/* ── Empujar todo el contenido 210px a la derecha ──────────────────────── */
body {
  padding-left: 210px !important;
}
.navbar {
  left: 210px !important;
  width: calc(100% - 210px) !important;
}

/* ── Ocultar los links de página en la navbar superior ─────────────────── */
.navbar-nav > li { display: none !important; }

/* ── Scrollbar del sidebar ─────────────────────────────────────────────── */
#sb-nav::-webkit-scrollbar { width: 4px; }
#sb-nav::-webkit-scrollbar-track { background: #0d1117; }
#sb-nav::-webkit-scrollbar-thumb { background: #21262d; border-radius: 2px; }
#sb-nav::-webkit-scrollbar-thumb:hover { background: #1ee29d; }

/* ── Responsive móvil: sidebar colapsable ──────────────────────────────── */
@media (max-width: 768px) {
  #sb-nav {
    width: 180px;
    transform: translateX(-180px);
    transition: transform 0.25s ease;
    z-index: 2100;
  }
  #sb-nav.sb-mobile-open {
    transform: translateX(0);
  }
  body { padding-left: 0 !important; }
  .navbar { left: 0 !important; width: 100% !important; }

  /* Botón hamburguesa solo en móvil */
  #sb-toggle {
    display: flex !important;
  }
  /* Overlay */
  #sb-overlay { display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.5); z-index: 2090; }
  #sb-overlay.sb-show { display: block; }
}

/* Botón hamburguesa (oculto en desktop) */
#sb-toggle {
  display: none;
  position: fixed;
  top: 8px;
  left: 8px;
  z-index: 2200;
  background: #1ee29d;
  color: #0d1117;
  border: none;
  border-radius: 6px;
  width: 36px;
  height: 36px;
  font-size: 1.2rem;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(30,226,157,0.4);
}
</style>

<script>
// Lógica móvil: botón hamburguesa
(function() {
  function setupMobile() {
    var btn = document.createElement("button");
    btn.id = "sb-toggle";
    btn.innerHTML = "&#9776;";
    document.body.appendChild(btn);

    var overlay = document.createElement("div");
    overlay.id = "sb-overlay";
    document.body.appendChild(overlay);

    var sidebar = document.getElementById("sb-nav");
    btn.addEventListener("click", function() {
      sidebar.classList.toggle("sb-mobile-open");
      overlay.classList.toggle("sb-show");
    });
    overlay.addEventListener("click", function() {
      sidebar.classList.remove("sb-mobile-open");
      overlay.classList.remove("sb-show");
    });
    // Cerrar al seleccionar link en móvil
    sidebar.querySelectorAll("a").forEach(function(a) {
      a.addEventListener("click", function() {
        if (window.innerWidth <= 768) {
          sidebar.classList.remove("sb-mobile-open");
          overlay.classList.remove("sb-show");
        }
      });
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", setupMobile);
  } else {
    setupMobile();
  }
})();
</script>

<script>
// ── Bloqueo de secciones premium (blur + marca de agua) ───────────────────
(function() {
  // IDs generados por pandoc a partir de los encabezados "# ..." del Rmd
  var seccionesPremium = {
    "modelo-econometrico":      "Modelo Econométrico",
    "comportamiento-por-mes":   "Comportamiento por Mes",
    "modelo-diario-tentativo":  "Modelo Diario (Tentativo)"
  };

  function bloquearSecciones() {
    Object.keys(seccionesPremium).forEach(function(id) {
      var seccion = document.getElementById(id);
      if (!seccion || seccion.classList.contains("premium-locked")) return;

      seccion.classList.add("premium-locked");

      var overlay = document.createElement("div");
      overlay.className = "premium-overlay";
      overlay.innerHTML =
        '<div class="po-icon">🔒</div>' +
        '<div class="po-title">Sección solo disponible para versión de pago</div>' +
        '<div class="po-sub">"' + seccionesPremium[id] + '" es contenido exclusivo para usuarios con suscripción activa.</div>' +
        '<div class="po-badge">Acceso de pago</div>';

      seccion.appendChild(overlay);
    });
  }

  // Reintentar varias veces por si el contenido de flexdashboard
  // (widgets htmlwidgets, plotly, DT) termina de renderizar después
  var attempts = 0;
  var interval = setInterval(function() {
    bloquearSecciones();
    attempts++;
    if (attempts > 15) clearInterval(interval);
  }, 200);

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", bloquearSecciones);
  } else {
    bloquearSecciones();
  }
})();
</script>
